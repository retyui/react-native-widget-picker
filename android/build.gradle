buildscript {
    ext.safeExtGet = {prop, fallback ->
        rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }

    def kotlin_version = safeExtGet('kotlinVersion', '2.1.20')
    def spotless_version = safeExtGet('spotlessVersion', '8.11.0')

    repositories {
        google()
        gradlePluginPortal()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.4.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
        classpath "com.diffplug.spotless:spotless-plugin-gradle:$spotless_version"
    }
}

if (project == rootProject) {
  apply from: 'spotless.gradle'
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// Standalone (root) project is only used for linting and has no RN Gradle plugin on its classpath
def isConsumedByApp = project != rootProject
if (isConsumedByApp) {
    apply plugin: "com.facebook.react"
}

def supportsNamespace() {
    def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
    def major = parsed[0].toInteger()
    def minor = parsed[1].toInteger()

    // Namespace support was added in 7.3.0
    if (major == 7 && minor >= 3) {
        return true
    }

    return major >= 8
}

android {
    compileSdkVersion safeExtGet('compileSdkVersion', 35)

    if (supportsNamespace()) {
        namespace "com.retyui.widgetpicker"
        sourceSets {
            main {
                manifest.srcFile "src/main/AndroidManifestNew.xml"
            }
        }
    }

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 24)
        targetSdkVersion safeExtGet('targetSdkVersion', 34)
    }

    lint {
        disable "GradleCompatible"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            java.srcDirs += ["${project.buildDir}/generated/source/codegen/java"]
            if (!supportsNamespace()) {
                manifest.srcFile "src/main/AndroidManifest.xml"
            }
        }
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    implementation "com.facebook.react:react-android" // Version set by the React Native Gradle Plugin
}

if (isConsumedByApp) {
    react {
        jsRootDir = file("../src/")
        libraryName = "WidgetPicker"
        codegenJavaPackageName = "com.retyui.widgetpicker"
    }
}
