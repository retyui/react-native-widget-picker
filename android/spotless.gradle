// formatter & linter configuration for java & kotlin
apply plugin: 'com.diffplug.spotless'

spotless {
  java {
    target 'src/**/*.java'
    googleJavaFormat('2.0.0')
    trimTrailingWhitespace()
    endWithNewline()
  }
  kotlin {
    target 'src/**/*.kt'
    ktfmt('0.64').kotlinlangStyle()
    trimTrailingWhitespace()
    leadingTabsToSpaces()
    endWithNewline()
  }
}
