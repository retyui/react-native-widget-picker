name: Build Android App

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RN_APP_NAME: MyApp
  JAVA_VERSION: 21
  NODE_VERSION: 24

jobs:
  lint_js:
    name: Lint JS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Prettier
        run: yarn format:check

      - name: Build
        run: yarn build

  lint_android:
    name: Format Android (Spotless)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: yarn install --immutable

      - run: yarn lint:android

  build_app:
    name: Build RN@${{ matrix.rn_ver }}
    needs: [lint_js, lint_android]
    strategy:
      fail-fast: false
      matrix:
        rn_ver: [0.89.0-rc.0, 0.88.1, 0.87.1, 0.86.3, 0.85.3, 0.84.1, 0.83.10, 0.82.1, 0.81.6, 0.80.3]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create Tmp React Native App
        working-directory: /tmp
        run: |
          # Create new tmp React Native
          npx @react-native-community/cli@latest init "$RN_APP_NAME" --version ${{ matrix.rn_ver }} --skip-git-init --install-pods false
          cd "$RN_APP_NAME"

          # Install my module
          yarn add "file:${{ github.workspace }}"

          # Debug info
          npx react-native info

          # Make sure new arch is enabled (it is opt-out on RN < 0.82)
          sed -i 's/newArchEnabled=false/newArchEnabled=true/' android/gradle.properties

      - name: Build Android App
        working-directory: /tmp/${{ env.RN_APP_NAME }}
        run: ./android/gradlew -p android assembleRelease -PreactNativeArchitectures=x86_64
