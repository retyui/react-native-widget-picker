name: Build Android App

on: [push]

env:
  RN_APP_NAME: MyApp

jobs:
  link_android:
    name: Lint Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Setup Java 19
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 19

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: yarn install

      - run: yarn lint:android

  build_app:
    name: Build RN@${{ matrix.rn_ver }}
    strategy:
      fail-fast: false
      matrix:
        rn_ver: [0.89.0-rc.0, 0.88.1, 0.87.1, 0.86.3, 0.85.3, 0.84.1, 0.83.10, 0.82.1, 0.81.6, 0.80.3]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Java 19
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 19

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build Tmp React Native App
        run: |
          cd /tmp

          # Create new tmp React Native
          npx @react-native-community/cli@latest init $RN_APP_NAME --version ${{ matrix.rn_ver }}
          cd $RN_APP_NAME

          # Install my module
          yarn add file:${{ github.workspace }}

          # Debug info
          npx react-native info

          # Make sure new arch is enabled (it is opt-out on RN < 0.82)
          sed -i 's/newArchEnabled=false/newArchEnabled=true/' android/gradle.properties
          ./android/gradlew generateCodegenArtifactsFromSchema -p android

          # Build Android App
          ./android/gradlew assembleRelease -p android -PreactNativeArchitectures=x86_64
