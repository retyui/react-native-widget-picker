name: Build Android App

on:
  push:
    branches: [main]
    paths: &paths
      - "src/**"
      - "android/**"
      - "ios/**"
      - "Package.swift"
      - "*.podspec"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".yarn/**"
      - "tsconfig*.json"
      - ".github/workflows/build_android.yaml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths: *paths

permissions:
  contents: read

concurrency:
  # One run per PR (or per branch on push); a new commit cancels the running one
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: 21
  NODE_VERSION: 24

jobs:
  lint_js:
    name: Lint JS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Prettier
        run: yarn format:check

      - name: Build
        run: yarn build

  lint_android:
    name: Format Android (Spotless)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: yarn install --immutable

      - run: yarn lint:android

  build_app:
    name: Build RN@${{ matrix.rn_ver }}
    needs: [lint_js, lint_android]
    strategy:
      fail-fast: false
      matrix:
        rn_ver: [latest]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Build Android App
        uses: retyui/oss-react-native-build/build-app@v0
        with:
          platform: android
          rn-ver: ${{ matrix.rn_ver }}
          new-arch-enabled: 1
          android-arch: x86_64

  build_ios:
    name: Build iOS RN@${{ matrix.rn_ver }} (${{ matrix.ios_package_manager }})
    needs: [lint_js]
    strategy:
      fail-fast: false
      matrix:
        rn_ver: [latest]
        ios_package_manager: [pods, spm]

    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Build iOS App
        uses: retyui/oss-react-native-build/build-app@v0
        with:
          platform: ios
          rn-ver: ${{ matrix.rn_ver }}
          new-arch-enabled: 1
          ios-package-manager: ${{ matrix.ios_package_manager }}
